description = 'FFMPEG Video Driver'
ext.details = "Driver for connecting to ffmpeg capable video streams"
version = '1.1.0'

// The FFmpeg/JavaCPP engine classes (MpegTsProcessor, VideoOutput, AudioOutput, etc.)
// live in :sensorhub-utils-ffmpeg so they can be reused by other drivers
// (e.g. sensorhub-driver-axis) without pulling in this driver's IModuleProvider.
dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    api project(':sensorhub-utils-ffmpeg')
    testImplementation('junit:junit:4.13.1')
    testImplementation('org.jcodec:jcodec-javase:0.1.9')
}

// exclude tests requiring connection to the sensor
// these have to be run manually
//      If tests are to be excluded list them here as follows
//          exclude '**/TestNameClass.class'
test {
    useJUnit()
}

// add info to OSGi manifest
osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'org.sensorhub.impl.sensor.ffmpeg.Activator')
    }
}

// add info to maven pom
ext.pom >>= {
    developers {
        developer {
            id 'drewbotts'
            name 'Drew Botts'
            organization 'Botts Innovative Research, Inc.'
            organizationUrl 'http://www.botts-inc.com'
        }
    }
}